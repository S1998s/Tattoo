<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aagam Tattoo Studio creates thoughtful, custom tattoos made to feel like they have always belonged to you."
    />
    <meta name="theme-color" content="#151412" />
    <title>Aagam Tattoo Studio — Ink with meaning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./aagam-logo.png" />
    <style>
      :root {
        font-family: "DM Sans", sans-serif;
        color: #eee9df;
        background: #151412;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --paper: #151412;
        --ink: #eee9df;
        --muted: #aaa399;
        --red: #c2a16b;
        --line: rgba(238, 233, 223, 0.15);
        --serif: "Playfair Display", Georgia, serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 92px;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      button,
      a {
        color: inherit;
        font: inherit;
      }

      a {
        text-decoration: none;
      }

      button {
        cursor: pointer;
      }

      img {
        display: block;
        width: 100%;
      }

      .announcement {
        padding: 9px 20px;
        background: #0e0d0c;
        color: var(--ink);
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .announcement span {
        color: var(--red);
      }

      .site-header {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 78px;
        padding: 0 7.1%;
        border-bottom: 1px solid var(--line);
        background: rgba(21, 20, 18, 0.95);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
      }

      .brand-logo {
        display: block;
        width: 76px;
        height: 76px;
        object-fit: contain;
      }

      footer .brand-logo {
        width: 90px;
        height: 90px;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 34px;
        font-size: 11px;
        letter-spacing: 0.05em;
      }

      .nav-links > a:not(.button-link) {
        transition: color 180ms ease;
      }

      .nav-links a:not(.button-link):hover,
      .footer-links a:hover {
        color: var(--red);
      }

      .button-link,
      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 21px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
      }

      .button-link:hover,
      .button:hover {
        border-color: var(--red);
        background: var(--red);
      }

      .button-light {
        border-color: var(--ink);
        background: transparent;
        color: var(--ink);
      }

      .button-light:hover {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--paper);
      }

      .menu-toggle {
        display: none;
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        background: transparent;
        font-size: 20px;
      }

      .hero {
        position: relative;
        display: flex;
        min-height: 700px;
        align-items: center;
        overflow: hidden;
        background: #0e0d0c;
        color: var(--ink);
      }

      .hero-image {
        position: absolute;
        inset: 0 0 0 auto;
        width: 61%;
        height: 100%;
        object-fit: cover;
        object-position: center 24%;
        opacity: 0.85;
      }

      .hero::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #0e0d0c 0%, rgba(14, 13, 12, 0.98) 32%, rgba(14, 13, 12, 0.74) 49%, rgba(14, 13, 12, 0.16) 100%);
        content: "";
      }

      .hero-content {
        position: relative;
        z-index: 1;
        width: min(620px, 56%);
        margin-left: 10%;
        padding: 92px 0 110px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 22px;
        color: var(--red);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.21em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 29px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      .hero .eyebrow {
        color: var(--red);
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1,
      h2,
      h3 {
        font-family: var(--serif);
        font-weight: 500;
      }

      h1 {
        max-width: 640px;
        margin-bottom: 25px;
        font-size: clamp(62px, 8vw, 108px);
        letter-spacing: -0.06em;
        line-height: 0.91;
      }

      h1 em,
      .section-title em {
        color: var(--red);
        font-weight: 500;
      }

      .hero-copy {
        max-width: 410px;
        margin-bottom: 35px;
        color: rgba(238, 233, 223, 0.76);
        font-size: 14px;
        line-height: 1.85;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .hero .button:not(.button-light),
      .button-link {
        border-color: var(--red);
        background: var(--red);
        color: #17130d;
      }

      .hero .button:not(.button-light):hover,
      .button-link:hover {
        border-color: #d7bd8c;
        background: #d7bd8c;
      }

      .hero .button-light {
        border-color: rgba(238, 233, 223, 0.48);
        color: var(--ink);
      }

      .hero .button-light:hover {
        border-color: var(--ink);
      }

      .hero-note {
        position: absolute;
        z-index: 1;
        right: 5.2%;
        bottom: 36px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: rgba(238, 233, 223, 0.72);
        font-size: 9px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .hero-note::before {
        width: 36px;
        height: 1px;
        background: var(--red);
        content: "";
      }

      .hero::before {
        position: absolute;
        z-index: 1;
        inset: 22px;
        border: 1px solid rgba(238, 233, 223, 0.09);
        content: "";
        pointer-events: none;
      }

      .marquee {
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 3vw, 42px);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .marquee span:nth-child(even) {
        color: var(--red);
        font-size: 12px;
      }

      .section {
        padding: 112px 11.2%;
      }

      .intro {
        display: grid;
        grid-template-columns: 0.88fr 1.12fr;
        align-items: center;
        gap: 10%;
      }

      .intro-image-wrap {
        position: relative;
        min-height: 470px;
        border: 1px solid var(--line);
        padding: 12px;
      }

      .intro-image {
        position: absolute;
        inset: 12px;
        width: calc(100% - 24px);
        height: calc(100% - 24px);
        object-fit: cover;
        object-position: center;
      }

      .image-caption {
        position: absolute;
        right: 0;
        bottom: 0;
        display: grid;
        width: 164px;
        min-height: 95px;
        align-content: center;
        padding: 17px;
        background: var(--red);
        color: #17130d;
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.3;
      }

      .image-caption small {
        margin-bottom: 6px;
        font-family: "DM Sans", sans-serif;
        font-size: 8px;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .section-title {
        margin-bottom: 20px;
        font-size: clamp(39px, 5vw, 62px);
        letter-spacing: -0.045em;
        line-height: 1.07;
      }

      .intro .section-title em {
        color: var(--red);
      }

      .body-copy {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.95;
      }

      .intro .body-copy {
        max-width: 445px;
      }

      .text-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--red);
        color: var(--red);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .styles {
        background: #1b1916;
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 30px;
        margin-bottom: 42px;
      }

      .section-heading .section-title {
        max-width: 540px;
        margin-bottom: 0;
      }

      .section-heading .body-copy {
        max-width: 310px;
        margin-bottom: 5px;
      }

      .style-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 19px;
      }

      .style-card {
        min-width: 0;
      }

      .style-image-wrap {
        position: relative;
        overflow: hidden;
        aspect-ratio: 0.91;
        border: 1px solid rgba(238, 233, 223, 0.13);
        background: #24211d;
      }

      .style-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 450ms ease;
      }

      .style-card:hover .style-image {
        transform: scale(1.04);
      }

      .style-number {
        position: absolute;
        top: 15px;
        left: 16px;
        color: white;
        font-size: 9px;
        letter-spacing: 0.12em;
      }

      .style-caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 2px 0;
        border-bottom: 1px solid transparent;
      }

      .style-caption h3 {
        margin: 0;
        font-size: 22px;
      }

      .style-caption small {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .style-caption span {
        color: var(--red);
        font-size: 17px;
      }

      .process {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12%;
        align-items: start;
      }

      .process-copy {
        position: sticky;
        top: 130px;
      }

      .process-copy .body-copy {
        max-width: 390px;
      }

      .steps {
        border-top: 1px solid var(--line);
      }

      .step {
        display: grid;
        grid-template-columns: 43px 1fr;
        gap: 15px;
        padding: 25px 0;
        border-bottom: 1px solid var(--line);
      }

      .step-number {
        padding-top: 4px;
        color: var(--red);
        font-size: 10px;
        letter-spacing: 0.1em;
      }

      .step h3 {
        margin-bottom: 7px;
        font-size: 21px;
      }

      .step p {
        max-width: 340px;
        margin-bottom: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
      }

      .quote {
        position: relative;
        overflow: hidden;
        padding: 87px 20px;
        background: #0e0d0c;
        color: var(--ink);
        text-align: center;
      }

      .quote::before,
      .quote::after {
        position: absolute;
        width: 350px;
        height: 350px;
        border: 1px solid rgba(238, 233, 223, 0.09);
        border-radius: 50%;
        content: "";
      }

      .quote::before {
        top: -240px;
        left: -110px;
      }

      .quote::after {
        right: -120px;
        bottom: -280px;
      }

      .quote-mark {
        margin-bottom: 12px;
        color: var(--red);
        font-family: var(--serif);
        font-size: 54px;
        line-height: 0.7;
      }

      .quote blockquote {
        max-width: 750px;
        margin: 0 auto 23px;
        font-family: var(--serif);
        font-size: clamp(27px, 4.3vw, 47px);
        letter-spacing: -0.025em;
        line-height: 1.25;
      }

      .quote cite {
        color: rgba(238, 233, 223, 0.62);
        font-size: 9px;
        font-style: normal;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .booking {
        display: grid;
        grid-template-columns: 1fr 0.8fr;
        gap: 10%;
        align-items: center;
        background: #1b1916;
      }

      .booking .section-title {
        max-width: 570px;
      }

      .booking .section-title em {
        color: var(--red);
      }

      .booking-card {
        padding: 30px;
        border: 1px solid var(--line);
        background: #201e1a;
      }

      .booking-card .eyebrow {
        margin-bottom: 17px;
      }

      .booking-card h3 {
        margin-bottom: 12px;
        font-size: 28px;
      }

      .booking-card p {
        margin-bottom: 22px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
      }

      .booking-card .button {
        width: 100%;
      }

      .studio-location {
        margin-top: 26px;
        padding-top: 23px;
        border-top: 1px solid var(--line);
      }

      .studio-location .eyebrow {
        margin-bottom: 12px;
      }

      .studio-address {
        margin-bottom: 17px;
        color: var(--ink);
        font-size: 12px;
        font-style: normal;
        line-height: 1.85;
      }

      .map-link {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        gap: 9px;
        padding: 0 13px;
        border: 1px solid var(--line);
        color: var(--red);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: border-color 180ms ease, background 180ms ease;
      }

      .map-link:hover {
        border-color: var(--red);
        background: rgba(194, 161, 107, 0.08);
      }

      .map-link svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .whatsapp-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 11px;
        padding: 0 19px;
        border: 1px solid rgba(37, 211, 102, 0.55);
        background: #17251b;
        color: #e8f2e9;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
      }

      .whatsapp-button:hover {
        transform: translateY(-2px);
        border-color: #25d366;
        background: #1d3324;
      }

      .whatsapp-icon {
        display: block;
        width: 21px;
        height: 21px;
        flex: 0 0 auto;
        color: #25d366;
      }

      .whatsapp-float {
        position: fixed;
        z-index: 20;
        right: 25px;
        bottom: 25px;
        display: inline-flex;
        min-height: 54px;
        align-items: center;
        gap: 11px;
        padding: 0 19px;
        border: 1px solid rgba(37, 211, 102, 0.55);
        border-radius: 999px;
        background: #17251b;
        color: #e8f2e9;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .whatsapp-float:hover {
        transform: translateY(-3px);
        border-color: #25d366;
        background: #1d3324;
      }

      .whatsapp-button:focus-visible,
      .whatsapp-float:focus-visible {
        outline: 2px solid #25d366;
        outline-offset: 4px;
      }

      .consultation-dialog {
        width: min(540px, calc(100% - 32px));
        max-width: none;
        max-height: min(90dvh, 760px);
        overflow-y: auto;
        padding: 0;
        border: 1px solid rgba(194, 161, 107, 0.42);
        background: #1b1916;
        color: var(--ink);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.65);
      }

      .consultation-dialog::backdrop {
        background: rgba(7, 7, 6, 0.78);
        backdrop-filter: blur(5px);
      }

      .consultation-dialog-inner {
        padding: clamp(24px, 5vw, 42px);
      }

      .consultation-dialog-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }

      .consultation-dialog-header .eyebrow {
        margin-bottom: 13px;
      }

      .consultation-dialog h2 {
        margin: 0;
        font-size: clamp(30px, 6vw, 42px);
        letter-spacing: -0.04em;
        line-height: 1.08;
      }

      .dialog-close {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font-size: 22px;
      }

      .dialog-close:hover {
        border-color: var(--red);
        color: var(--red);
      }

      .consultation-form {
        display: grid;
        gap: 17px;
      }

      .consultation-form label {
        display: grid;
        gap: 8px;
        color: var(--ink);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .consultation-form input {
        width: 100%;
        min-height: 48px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 0;
        outline: none;
        background: #12110f;
        color: var(--ink);
        font: 400 14px "DM Sans", sans-serif;
        letter-spacing: normal;
        text-transform: none;
      }

      .consultation-form input:focus {
        border-color: var(--red);
      }

      .consultation-form input::placeholder {
        color: #77736d;
      }

      .consultation-submit {
        width: 100%;
        min-height: 50px;
        margin-top: 3px;
        border: 1px solid var(--red);
        background: var(--red);
        color: #17130d;
        font: 600 10px "DM Sans", sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease;
      }

      .consultation-submit:hover {
        border-color: #d7bd8c;
        background: #d7bd8c;
      }

      .direct-contact {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 22px;
        padding-top: 21px;
        border-top: 1px solid var(--line);
      }

      .direct-contact-label {
        grid-column: 1 / -1;
        margin: 0 0 2px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .direct-contact .whatsapp-button {
        min-width: 0;
        padding: 0 10px;
        font-size: 9px;
      }

      .call-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
        transition: border-color 180ms ease, color 180ms ease;
      }

      .call-button:hover {
        border-color: var(--red);
        color: var(--red);
      }

      .call-button svg {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
      }

      .consultation-form :focus-visible,
      .dialog-close:focus-visible,
      .call-button:focus-visible {
        outline: 2px solid var(--red);
        outline-offset: 3px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 31px 7.1%;
        background: #0e0d0c;
        color: var(--ink);
      }

      .footer-note {
        margin: 0;
        color: rgba(238, 233, 223, 0.56);
        font-size: 9px;
        letter-spacing: 0.08em;
      }

      .footer-links {
        display: flex;
        gap: 22px;
        font-size: 10px;
      }

      @media (min-width: 1500px) {
        .hero {
          min-height: 710px;
        }
      }

      @media (max-width: 900px) {
        .site-header {
          padding: 0 5%;
        }

        .nav-links {
          gap: 19px;
        }

        .section {
          padding: 85px 7%;
        }

        .hero-content {
          margin-left: 7%;
        }

        .hero-image {
          width: 68%;
        }

        .intro {
          gap: 7%;
        }

        .intro-image-wrap {
          min-height: 390px;
        }

        .process {
          gap: 7%;
        }
      }

      @media (max-width: 680px) {
        html {
          scroll-padding-top: 72px;
        }

        .announcement {
          font-size: 8px;
        }

        .site-header {
          height: 68px;
        }

        .site-header .brand-logo {
          width: 62px;
          height: 62px;
        }

        .menu-toggle {
          display: grid;
          place-items: center;
        }

        .nav-links {
          position: absolute;
          top: 67px;
          right: 0;
          left: 0;
          display: none;
          align-items: stretch;
          gap: 0;
          padding: 8px 5% 20px;
          border-bottom: 1px solid var(--line);
          background: var(--paper);
        }

        .nav-links.is-open {
          display: flex;
          flex-direction: column;
        }

        .nav-links > a:not(.button-link) {
          padding: 14px 0;
          border-bottom: 1px solid var(--line);
        }

        .nav-links .button-link {
          margin-top: 15px;
        }

        .hero {
          min-height: 610px;
        }

        .hero-image {
          width: 100%;
          object-position: 58% 24%;
          opacity: 0.58;
        }

        .hero::after {
          background: linear-gradient(90deg, rgba(14, 13, 12, 0.93), rgba(14, 13, 12, 0.56)), linear-gradient(0deg, rgba(14, 13, 12, 0.82), transparent 72%);
        }

        .hero::before {
          inset: 10px;
        }

        .hero-content {
          width: 88%;
          margin-left: 6%;
          padding: 76px 0;
        }

        h1 {
          font-size: clamp(50px, 15vw, 70px);
        }

        .hero .eyebrow {
          gap: 8px;
          font-size: 8px;
          letter-spacing: 0.14em;
        }

        .hero-note {
          right: 6%;
          bottom: 21px;
          font-size: 8px;
        }

        .marquee {
          min-height: 55px;
          gap: 9px;
          font-size: 7px;
          letter-spacing: 0.12em;
          white-space: nowrap;
        }

        .marquee span:nth-child(n + 5) {
          display: none;
        }

        .section {
          padding: 70px 6%;
        }

        .intro,
        .process,
        .booking {
          grid-template-columns: 1fr;
          gap: 38px;
        }

        .intro-image-wrap {
          min-height: 390px;
          order: 2;
        }

        .intro-copy {
          order: 1;
        }

        .section-heading {
          align-items: start;
          flex-direction: column;
          gap: 15px;
          margin-bottom: 30px;
        }

        .style-grid {
          grid-template-columns: 1fr 1fr;
          gap: 25px 14px;
        }

        .style-card:last-child {
          grid-column: 1 / -1;
          width: calc(50% - 7px);
        }

        .style-caption h3 {
          font-size: 18px;
        }

        .style-caption small {
          font-size: 8px;
        }

        .process-copy {
          position: static;
        }

        .booking {
          gap: 12px;
        }

        .booking-card {
          padding: 25px;
        }

        .whatsapp-float {
          right: 16px;
          bottom: 16px;
          min-height: 52px;
          padding: 0 16px;
        }

        footer {
          align-items: flex-start;
          flex-direction: column;
          padding: 27px 6%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;

      const styles = [
        {
          number: "01",
          title: "Black & grey",
          detail: "Layered shading · Intricate form",
          image:
            "https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?auto=format&fit=crop&w=900&q=85",
          alt: "Intricate black and grey tattoo artwork on a person's back",
        },
        {
          number: "02",
          title: "Fine line",
          detail: "Fine detail · Soft, deliberate lines",
          image:
            "https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?auto=format&fit=crop&w=900&q=85",
          alt: "Fine-line floral tattoo on an arm",
        },
        {
          number: "03",
          title: "Custom art",
          detail: "Your story · Drawn from scratch",
          image:
            "https://images.unsplash.com/photo-1565058379802-bbe93b2f703a?auto=format&fit=crop&w=900&q=85",
          alt: "Artist creating a custom tattoo",
        },
      ];

      const steps = [
        {
          number: "01",
          title: "Tell us your story",
          copy: "Share the idea, the feeling, or even just a reference. We’ll take it from there.",
        },
        {
          number: "02",
          title: "Make it yours",
          copy: "Your artist will shape a one-of-a-kind design around your vision and placement.",
        },
        {
          number: "03",
          title: "Settle in",
          copy: "A calm studio, thoughtful guidance, and a process that puts your comfort first.",
        },
      ];

      const whatsappHref =
        "https://wa.me/917806921715?text=" +
        encodeURIComponent(
          "Hi Aagam Tattoo Studio! I'd like to book a tattoo consultation. Could you please share your availability?"
        );
      const studioPhone = "+917806921715";

      function WhatsAppIcon() {
        return (
          <svg className="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M20.52 3.48A11.83 11.83 0 0 0 12.1 0C5.53 0 .18 5.35.18 11.92c0 2.1.55 4.15 1.6 5.96L.08 24l6.27-1.64a11.9 11.9 0 0 0 5.74 1.46h.01c6.57 0 11.92-5.35 11.93-11.92a11.84 11.84 0 0 0-3.51-8.42ZM12.1 21.8h-.01a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.72.97.99-3.63-.23-.37a9.88 9.88 0 0 1-1.52-5.26c0-5.46 4.45-9.91 9.9-9.91a9.85 9.85 0 0 1 7.01 2.91 9.84 9.84 0 0 1 2.9 7.02c0 5.46-4.45 9.9-9.92 9.9Zm5.44-7.42c-.3-.15-1.76-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.03-.53-.08-.15-.67-1.62-.92-2.22-.24-.58-.48-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.71.62.72.23 1.37.2 1.88.12.58-.09 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.08-.12-.27-.2-.57-.35Z"
            />
          </svg>
        );
      }

      function App() {
        const [menuOpen, setMenuOpen] = useState(false);
        const [consultationOpen, setConsultationOpen] = useState(false);
        const consultationDialogRef = useRef(null);

        const closeMenu = () => setMenuOpen(false);
        const openConsultation = (event) => {
          event.preventDefault();
          closeMenu();
          setConsultationOpen(true);
        };

        useEffect(() => {
          const dialog = consultationDialogRef.current;
          if (!dialog) return;

          if (consultationOpen && !dialog.open) {
            dialog.showModal();
          } else if (!consultationOpen && dialog.open) {
            dialog.close();
          }
        }, [consultationOpen]);

        const submitConsultation = (event) => {
          event.preventDefault();
          const formData = new FormData(event.currentTarget);
          const name = String(formData.get("name")).trim();
          const phone = String(formData.get("phone")).trim();
          const phoneInput = event.currentTarget.elements.namedItem("phone");
          const phoneDigits = phone.replace(/\D/g, "");

          if (phoneDigits.length < 7 || phoneDigits.length > 15) {
            phoneInput.setCustomValidity("Enter a phone number containing 7 to 15 digits.");
            phoneInput.reportValidity();
            return;
          }

          phoneInput.setCustomValidity("");
          const message = [
            "Hi Aagam Tattoo Studio!",
            "I'd like to book a tattoo consultation.",
            `Name: ${name}`,
            `Phone: ${phone}`,
            "Could you please share your availability?",
          ].join("\n");
          const contactUrl = `https://wa.me/${studioPhone.slice(1)}?text=${encodeURIComponent(message)}`;

          setConsultationOpen(false);
          window.open(contactUrl, "_blank", "noopener,noreferrer");
        };

        return (
          <>
            <div className="announcement">
              Thoughtful tattoos, made just for you <span>·</span> By appointment
            </div>
            <header className="site-header">
              <a className="brand" href="#home" onClick={closeMenu} aria-label="Aagam Tattoo Studio home">
                <img className="brand-logo" src="./aagam-logo.png" alt="Aagam Tattoo Studio" />
              </a>
              <button
                className="menu-toggle"
                type="button"
                onClick={() => setMenuOpen(!menuOpen)}
                aria-label={menuOpen ? "Close navigation menu" : "Open navigation menu"}
                aria-expanded={menuOpen}
                aria-controls="main-navigation"
              >
                {menuOpen ? "×" : "☰"}
              </button>
              <nav id="main-navigation" className={`nav-links${menuOpen ? " is-open" : ""}`} aria-label="Main navigation">
                <a href="#story" onClick={closeMenu}>Our story</a>
                <a href="#styles" onClick={closeMenu}>Tattoo styles</a>
                <a href="#process" onClick={closeMenu}>The process</a>
                <a className="button-link" href="#consultation" onClick={openConsultation}>
                  Book a consultation <span aria-hidden="true">↗</span>
                </a>
              </nav>
            </header>

            <main>
              <section className="hero" id="home">
                <img
                  className="hero-image"
                  src="https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?auto=format&fit=crop&w=1800&q=90"
                  alt="Intricate black and grey tattoo artwork on a person's back"
                />
                <div className="hero-content">
                  <p className="eyebrow">Artist-led · Made personal</p>
                  <h1>Wear your<br /><em>story.</em></h1>
                  <p className="hero-copy">
                    Original tattoos, thoughtfully designed around you. From the first
                    sketch to the final detail, every piece begins with your story.
                  </p>
                  <div className="hero-actions">
                    <a className="button" href="#consultation" onClick={openConsultation}>Begin your piece <span aria-hidden="true">↗</span></a>
                    <a className="button button-light" href="#styles">Explore our work</a>
                  </div>
                </div>
                <div className="hero-note">Original artwork · One of one</div>
              </section>

              <div className="marquee" aria-label="Custom tattoos, thoughtful design, made with care">
                <span>Artist-led</span><span aria-hidden="true">✳</span>
                <span>Original design</span><span aria-hidden="true">✳</span>
                <span>Thoughtfully made</span><span aria-hidden="true">✳</span>
                <span>Always personal</span>
              </div>

              <section className="section intro" id="story">
                <div className="intro-image-wrap">
                  <img
                    className="intro-image"
                    src="https://images.unsplash.com/photo-1565058379802-bbe93b2f703a?auto=format&fit=crop&w=1100&q=85"
                    alt="Tattoo artist creating a custom tattoo"
                    loading="lazy"
                  />
                  <div className="image-caption">
                    <small>Our point of view</small>
                    Art that feels like you.
                  </div>
                </div>
                <div className="intro-copy">
                  <p className="eyebrow">More than ink</p>
                  <h2 className="section-title">Every mark has a <em>meaning.</em></h2>
                  <p className="body-copy">
                    At Aagam, no two stories are the same—and no two tattoos should be.
                    We bring your idea to life with thoughtful design, a steady hand, and
                    the kind of care that makes the whole experience feel yours.
                  </p>
                  <a className="text-link" href="#process">A little about our process <span aria-hidden="true">→</span></a>
                </div>
              </section>

              <section className="section styles" id="styles">
                <div className="section-heading">
                  <div>
                    <p className="eyebrow">Selected artistry</p>
                    <h2 className="section-title">A signature in <em>every line.</em></h2>
                  </div>
                  <p className="body-copy">
                    Different hands. Distinct points of view. Explore the craft, then
                    let’s shape a piece that feels unmistakably yours.
                  </p>
                </div>
                <div className="style-grid">
                  {styles.map((style) => (
                    <article className="style-card" key={style.number}>
                      <a href="#booking" aria-label={`Ask us about ${style.title} tattoos`}>
                        <div className="style-image-wrap">
                          <img className="style-image" src={style.image} alt={style.alt} loading="lazy" />
                          <span className="style-number">{style.number} / 03</span>
                        </div>
                        <div className="style-caption">
                          <div>
                            <h3>{style.title}</h3>
                            <small>{style.detail}</small>
                          </div>
                          <span aria-hidden="true">↗</span>
                        </div>
                      </a>
                    </article>
                  ))}
                </div>
              </section>

              <section className="section process" id="process">
                <div className="process-copy">
                  <p className="eyebrow">From first thought to forever</p>
                  <h2 className="section-title">A good tattoo starts with a <em>good conversation.</em></h2>
                  <p className="body-copy">
                    New to tattoos or adding to your collection? We’ll make the next
                    steps clear, comfortable, and collaborative.
                  </p>
                  <a className="text-link" href="#booking">Let’s talk about your idea <span aria-hidden="true">→</span></a>
                </div>
                <div className="steps">
                  {steps.map((step) => (
                    <article className="step" key={step.number}>
                      <span className="step-number">{step.number}</span>
                      <div>
                        <h3>{step.title}</h3>
                        <p>{step.copy}</p>
                      </div>
                    </article>
                  ))}
                </div>
              </section>

              <section className="quote" aria-label="Our philosophy">
                <div className="quote-mark" aria-hidden="true">“</div>
                <blockquote>
                  The best tattoo doesn’t just look like you. It feels like you.
                </blockquote>
                <cite>The Aagam approach</cite>
              </section>

              <section className="section booking" id="booking">
                <div>
                  <p className="eyebrow">Your idea, our next conversation</p>
                  <h2 className="section-title">Ready to make it <em>personal?</em></h2>
                  <p className="body-copy">
                    Tell us what you have in mind. We’ll help you find the right artist,
                    style, and next step.
                  </p>
                </div>
                <div className="booking-card">
                  <p className="eyebrow">Start with a consultation</p>
                  <h3>Let’s make something meaningful.</h3>
                  <p>Bring a fully formed idea or just a feeling. We’re happy to help you shape it.</p>
                  <a
                    className="whatsapp-button"
                    href={whatsappHref}
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    <WhatsAppIcon /> Message us on WhatsApp
                  </a>
                  <div className="studio-location">
                    <p className="eyebrow">Visit the studio</p>
                    <address className="studio-address">
                      Beemarav K<br />
                      Railway Feeder Road, Madurai Main Road<br />
                      Opposite SBI Town Branch<br />
                      Tenkasi, Tamil Nadu 627811
                    </address>
                    <a
                      className="map-link"
                      href="https://maps.app.goo.gl/qzeVMnsxN4LgXC59A"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                        <circle cx="12" cy="10" r="2.5" />
                      </svg>
                      View map &amp; directions <span aria-hidden="true">↗</span>
                    </a>
                  </div>
                </div>
              </section>
            </main>

            <footer>
              <a className="brand" href="#home">
                <img className="brand-logo" src="./aagam-logo.png" alt="Aagam Tattoo Studio" />
              </a>
              <p className="footer-note">Thoughtful tattoos. Made with care. © {new Date().getFullYear()} Aagam Tattoo Studio</p>
              <div className="footer-links">
                <a href="#story">Our story</a>
                <a href="#booking">Contact</a>
              </div>
            </footer>
            <a
              className="whatsapp-float"
              href={whatsappHref}
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Chat with Aagam Tattoo Studio on WhatsApp"
            >
              <WhatsAppIcon />
              <span>WhatsApp us</span>
            </a>
            <dialog
              className="consultation-dialog"
              ref={consultationDialogRef}
              aria-labelledby="consultation-title"
              onClose={() => setConsultationOpen(false)}
              onCancel={() => setConsultationOpen(false)}
              onKeyDown={(event) => {
                if (event.key === "Escape") {
                  event.preventDefault();
                  setConsultationOpen(false);
                }
              }}
              onClick={(event) => {
                if (event.target === event.currentTarget) {
                  setConsultationOpen(false);
                }
              }}
            >
              <div className="consultation-dialog-inner">
                <div className="consultation-dialog-header">
                  <div>
                    <p className="eyebrow">Start with a conversation</p>
                    <h2 id="consultation-title">Book your consultation.</h2>
                  </div>
                  <button
                    className="dialog-close"
                    type="button"
                    onClick={() => setConsultationOpen(false)}
                    aria-label="Close consultation form"
                    autoFocus
                  >
                    ×
                  </button>
                </div>
                <form className="consultation-form" onSubmit={submitConsultation}>
                  <label htmlFor="consultation-name">
                    Your name <span aria-hidden="true">*</span>
                    <input
                      id="consultation-name"
                      name="name"
                      type="text"
                      autoComplete="name"
                      placeholder="Enter your name"
                      required
                    />
                  </label>
                  <label htmlFor="consultation-phone">
                    Phone number <span aria-hidden="true">*</span>
                    <input
                      id="consultation-phone"
                      name="phone"
                      type="tel"
                      autoComplete="tel"
                      inputMode="tel"
                      maxLength={20}
                      placeholder="+91 98765 43210"
                      onChange={(event) => event.currentTarget.setCustomValidity("")}
                      required
                    />
                  </label>
                  <button className="consultation-submit" type="submit">
                    Continue on WhatsApp <span aria-hidden="true">↗</span>
                  </button>
                </form>
                <div className="direct-contact">
                  <p className="direct-contact-label">Prefer to contact us directly?</p>
                  <a
                    className="whatsapp-button"
                    href={whatsappHref}
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    <WhatsAppIcon /> WhatsApp
                  </a>
                  <a className="call-button" href={`tel:${studioPhone}`}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 11.19 18a19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.09 3.18 2 2 0 0 1 4.08 1h3a2 2 0 0 1 2 1.72c.12.96.35 1.9.68 2.8a2 2 0 0 1-.45 2.11L8.04 8.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.33 1.84.56 2.8.68A2 2 0 0 1 22 16.92Z" />
                    </svg>
                    Call directly
                  </a>
                </div>
              </div>
            </dialog>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
